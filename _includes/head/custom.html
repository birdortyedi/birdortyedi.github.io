{% include base_path %}

<!-- start custom head snippets -->

<!-- apply saved light/dark choice before first paint -->
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>

<link rel="icon" href="{{ base_path }}/favicon.ico" sizes="any">
<link rel="icon" href="{{ base_path }}/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{ base_path }}/apple-touch-icon.png">
<link rel="manifest" href="{{ base_path }}/site.webmanifest">
<meta name="theme-color" content="#f4f5f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
{% if site.author.orcid or site.author.pubmed or site.author.impactstory %}<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>{% endif %}

{% comment %} MathJax removed: no page uses math. To add it back, see the git history of this file. {% endcomment %}

<!-- end custom head snippets -->
