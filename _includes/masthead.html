{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <a class="site-title" href="{{ base_path }}/"{% if page.url == "/" %} aria-current="page"{% endif %}>{{ site.title }}</a>

      <div class="theme-switch" role="group" aria-label="Color theme">
        <button type="button" data-theme="light">light</button>
        <button type="button" data-theme="dark">dark</button>
        <button type="button" data-theme="system">system</button>
      </div>
      <script>
        (function () {
          var root = document.documentElement;
          var buttons = document.querySelectorAll('.theme-switch button');
          function mark(theme) {
            buttons.forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.theme === theme); });
          }
          buttons.forEach(function (b) {
            b.addEventListener('click', function () {
              var theme = b.dataset.theme;
              if (theme === 'system') root.removeAttribute('data-theme');
              else root.setAttribute('data-theme', theme);
              try {
                if (theme === 'system') localStorage.removeItem('theme');
                else localStorage.setItem('theme', theme);
              } catch (e) {}
              mark(theme);
            });
          });
          mark(root.getAttribute('data-theme') || 'system');
        })();
      </script>
      
      <!-- Checkbox for pure CSS mobile menu toggle -->
      <input type="checkbox" id="masthead-nav-toggle" class="masthead-nav-checkbox">
      
      <!-- Animated hamburger button -->
      <label for="masthead-nav-toggle" class="masthead-nav-label">
        <span class="navicon-line"></span>
        <span class="navicon-line"></span>
        <span class="navicon-line"></span>
      </label>
      
      <nav id="site-nav" class="site-nav">
        <ul class="visible-links">
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = site.baseurl %}
            {% endif %}
            {% if link.divider %}<li class="masthead__divider" aria-hidden="true"></li>{% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}"{% if page.url contains link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>
          {% endfor %}
        </ul>
      </nav>
    </div>
  </div>
</div>
