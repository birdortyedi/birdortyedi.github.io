  text: "We were among the finalists in \"[Night Photography Rendering Challenge](https://nightimaging.org/)\" at [NTIRE2025: New Trends in Image Restoration and Enhancement workshop and challenges on image and video processing in conjunction with CVPR 2025](https://cvlai.net/ntire/2025/)."

