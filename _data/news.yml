  text: "I have successfully defended my Ph.D. thesis, \"[Modeling the Lighting as Style Factor via Neural Networks for White Balance Correction](files/phd-thesis.pdf)\"."

- date: "March 19, 2025"
  text: "A paper titled \"[Feature distribution statistics as a loss objective for robust white balance correction](https://link.springer.com/article/10.1007/s00138-025-01680-1)\" was accepted to [Machine Vision and Applications](https://link.springer.com/journal/138)."

